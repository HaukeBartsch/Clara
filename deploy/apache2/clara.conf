# CLARA virtual host — Apache httpd 2.4 (RHEL 9/10 httpd, Debian 12 apache2)
#
# nginx is CLARA's reference reverse proxy (Technology_Stack_Design.md §5 fixes the
# routing rules; INSTALL.md §11.2 documents the nginx file). This is the equivalent
# configuration for a host that terminates TLS with httpd instead, implementing the same
# contract rule for rule so that both proxies answer identically to the smoke checks in
# INSTALL.md §13.1. Install as /etc/httpd/conf.d/clara.conf (RHEL) or
# /etc/apache2/sites-available/clara.conf, mode 0644 root (§5 "Files on the server"),
# replace clara.example.org with the real name, then `apachectl -t && apachectl graceful`.
#
# Keep it in step with deploy/nginx/clara.conf: change one, change the other.
#
# What it enforces (same rules, same sources):
#
#   TLS terminates here; plain HTTP redirects to HTTPS ..... §11.2, both vhosts
#   POST /api/ is the only public API route ................ REQ-TECH-018
#   /api/v1/* never routable; /docs, /openapi.json,
#   /healthz not proxied (PHP answers 404) ................. REQ-TECH-018, REQ-AUTH-014
#   X-Internal-* stripped from every external request .....  §5, REQ-AUTH-014
#   X-Real-IP is always the connection address, never a
#   client value; no forwarded-for chain .................. REQ-API-125, finding F9
#   Exports stream instead of buffering ................... ProxyTimeout, no-gzip; PHP
#                                                          sends X-Accel-Buffering: no
#
# Modules needed: mod_rewrite, mod_headers, mod_alias, mod_authz_core, mod_dir, mod_ssl,
# mod_proxy, mod_proxy_http, mod_proxy_fcgi (UDS support needs httpd >= 2.4.7). On RHEL
# they come from /etc/httpd/conf.modules.d/; `dnf install httpd mod_ssl` covers packages.
# Do not enable output compression for this vhost — a streamed export must not buffer.
#
# Two host-level things this file cannot do:
#   * RHEL's mod_ssl ships /etc/httpd/conf.d/ssl.conf with its own *:443 vhost and the
#     distribution welcome page. Remove that vhost (keep its `Listen 443`) or make sure
#     this one is reached first, so a request with no SNI, or with any other name, cannot
#     land on a page that is not CLARA.
#   * ServerTokens Prod belongs in the main server configuration, not here.
#
# SELinux: httpd runs in the same domain as nginx, so INSTALL.md §7 applies unchanged —
#   setsebool -P httpd_can_network_connect on    # proxy to 127.0.0.1:8080 and to PHP-FPM
# plus the httpd_sys_content_t labels of §7 for /opt/clara, and `restorecon -R` after
# every upgrade (§15.4). Denials: `ausearch -m AVC -ts recent`.

# --- plain HTTP: redirect only --------------------------------------------------
<VirtualHost *:80>
    ServerName clara.example.org

    # A certificate-renewal challenge has to be answered before the redirect, e.g.
    #   Alias /.well-known/acme-challenge/ /var/lib/acme/.well-known/acme-challenge/

    RewriteEngine On
    RewriteCond %{HTTPS} !=on
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [R=301,L]

    ErrorLog  /var/log/httpd/clara_error.log
    CustomLog /var/log/httpd/clara_access.log combined
</VirtualHost>

# --- HTTPS: pages, assets and the data API --------------------------------------
<VirtualHost *:443>
    ServerName clara.example.org

    SSLEngine on
    SSLCertificateFile  /etc/pki/tls/certs/clara.crt
    SSLCertificateKeyFile /etc/pki/tls/private/clara.key
    SSLProtocol TLSv1.2 TLSv1.3
    # HTTP/2 needs mod_http2:   Protocols h2 http/1.1

    DocumentRoot /opt/clara/web/public

    ErrorLog  /var/log/httpd/clara_error.log
    CustomLog /var/log/httpd/clara_access.log combined

    # REDCap-style record imports may be up to 32 MiB; a larger body answers 413, as the
    # nginx client_max_body_size and PHP's post_max_size/upload_max_filesize do (§10).
    LimitRequestBody 33554432

    ServerSignature Off

    # --- headers every response carries -----------------------------------------
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    # nginx: fastcgi_hide_header X-Powered-By
    Header always unset X-Powered-By

    # --- headers the caller may never supply -------------------------------------
    # Internal-boundary headers belong to PHP's own loopback calls to the API; stripped
    # here so no external request can carry them (REQ-TECH-018, REQ-AUTH-014). This also
    # covers the proxied /api/ path, because it is the same request.
    RequestHeader unset X-Internal-Service-Token
    RequestHeader unset X-Internal-User-Id
    RequestHeader unset X-Internal-Session-Epoch

    # The rate limiter's caller address is always this connection's address: set, not
    # added, so a browser cannot rotate addresses past the limiter or forge the address
    # written into an audit entry (REQ-API-125, finding F9). No forwarded-for chain.
    RequestHeader set X-Real-IP expr=%{REMOTE_ADDR}
    RequestHeader unset X-Forwarded-For

    # --- routing -----------------------------------------------------------------
    RewriteEngine On

    # The administration API is never routable from the network (REQ-TECH-018). 404, not
    # 403, so the refusal confirms nothing about the internal surface — and it must be a
    # rewrite rule rather than an excluded ProxyPass prefix: mod_proxy's map_to_storage
    # hook runs before mod_rewrite, so a `ProxyPass /api/` here would answer /api/v1/*
    # before any rule could refuse it. There is deliberately no ProxyPass in this file;
    # the [P] flag below is the only thing that proxies.
    RewriteRule "^/api/v1(/.*)?$" - [R=404,L]

    # Only POST reaches the data endpoint (nginx: limit_except POST { deny all; }).
    RewriteCond %{REQUEST_METHOD} !=POST
    RewriteRule "^/api/$" - [R=403,L]

    # The REDCap-compatible endpoint itself. Host passes through, and mod_proxy adds no
    # forwarding headers of its own (§5: no forwarded-for chains).
    RewriteRule "^/api/$" "http://127.0.0.1:8080/api/" [P,L]
    ProxyPreserveHost On
    ProxyAddHeaders Off

    # Exports stream and can take minutes (nginx: proxy_read_timeout/proxy_send_timeout).
    # Vhost scope, which is where ProxyTimeout is allowed and where the only proxied path
    # in this file lives.
    ProxyTimeout 600

    # no-gzip keeps mod_deflate, if it is loaded at all, from buffering a response that has
    # to arrive as it is produced.
    <Location /api/>
        SetEnv no-gzip 1
    </Location>

    # --- static CSS/JS/fonts (outside the document root) -------------------------
    # The same two trees the nginx file aliases. Alias resolves longest-match first, so
    # the vendor prefix wins for vendored libraries.
    Alias /assets/vendor/ /opt/clara/web/assets/vendor/
    Alias /assets/        /opt/clara/web/assets/

    <Directory /opt/clara/web/assets>
        Require all granted
        Options -Indexes
        # CLARA's own scripts and styles change with every deployment: browsers must
        # revalidate (a cheap 304 via ETag) or a day-old script runs under a new page and
        # its controls stay dead. Same value Response::asset() sends when PHP serves them.
        Header always set Cache-Control "no-cache"
    </Directory>

    # Third-party libraries change only on an upgrade, so they may be cached for a day.
    # A more specific <Directory> overrides the one above (longest path wins), which is
    # what makes this split work without ordering tricks.
    <Directory /opt/clara/web/assets/vendor>
        Header always set Cache-Control "public, max-age=86400"
    </Directory>

    # --- every page goes through the front controller ----------------------------
    <Directory /opt/clara/web/public>
        Require all granted
        Options -Indexes
        # The whole configuration lives here, so no per-directory file can widen it.
        AllowOverride None

        # Mirrors nginx's `try_files $uri /index.php$is_args$args`: a real file under the
        # document root is served as itself, anything else is routed. These two conditions
        # have to live in this <Directory>, not in the vhost: mod_rewrite evaluates
        # vhost-level rules during translate_name, before the URL has been mapped to a
        # file, where %{REQUEST_FILENAME} is still just the path and -f/-d therefore always
        # match (which would quietly route /assets/* and any real file to index.php too).
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule .* index.php [L]

        # No other PHP file is ever executed, and none is served as text either: the
        # document root holds only index.php, and everything else (web/app/, .env) sits
        # above it. Section order matters — <Files "index.php"> below re-grants what the
        # match denies, and only it carries the handler.
        <FilesMatch "\.php$">
            Require all denied
        </FilesMatch>

        <Files "index.php">
            Require all granted
            # PHP-FPM pool of §10; unix-socket support needs httpd >= 2.4.7. The authority
            # after | is a placeholder — the socket decides where the request goes.
            SetHandler "proxy:unix:/run/php-fpm/clara.sock|fcgi://localhost"
        </Files>
    </Directory>

    # The rewrite leaves REQUEST_URI untouched, which is what Clara\Router matches on
    # (web/app/Request.php:40), so /records/17 and ?action=save arrive unchanged. An
    # aliased /assets/* request never reaches this <Directory>, so a real library or
    # script is served as itself, and a missing one answers 404 rather than routing.
    # PHP's REMOTE_ADDR is set by httpd from the connection, so Request::clientIp() sees
    # the browser address directly and TRUSTED_PROXY_CIDRS stays unset (§6) — the same
    # position nginx holds with fastcgi_param REMOTE_ADDR. If another proxy ever sits in
    # front of this one, configure mod_remoteip for it or every caller collapses into that
    # proxy's single address for both rate limiting and audit entries.
</VirtualHost>
